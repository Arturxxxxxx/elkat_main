upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name expertkresel.kg www.expertkresel.kg 176.126.166.235;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name expertkresel.kg www.expertkresel.kg;

    ssl_certificate /etc/letsencrypt/live/expertkresel.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expertkresel.kg/privkey.pem;

    client_max_body_size 500M;

    # FRONTEND (то, что было в dist/nginx.conf)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # BACKEND
    location ~ ^/(api|admin)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
    }

    location /media/ {
        alias /home/app/web/media/;
    }
}