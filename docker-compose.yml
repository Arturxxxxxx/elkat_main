version: '3.8'

services:
  db:
    image: postgres:17-alpine
    volumes:
      - /home/db:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod.db
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: gunicorn root.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/home/app/web/staticfiles
      - /home/media:/home/app/web/media
    expose:
      - 8000
    env_file:
      - ./backend/.env
    depends_on:
      - db
  nginx:
    build: ./nginx
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - static_volume:/home/app/web/staticfiles
      - /home/media:/home/app/web/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - 80:80
      - 443:443
    depends_on:
      - web
  # front:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./dist:/usr/share/nginx/html:ro
  #     - ./dist/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  static_volume:
